<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій перший PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f0f0; margin-top: 50px; }
        .card { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #4CAF50; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привіт! Це мій перший PWA! 🎉</h1>
        <p>Він працює прямо з вашого смартфона.</p>
    </div>

    <script>
        // Реєстрація Service Worker для роботи офлайн
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker зареєстровано!', reg))
                    .catch(err => console.log('Помилка реєстрації SW:', err));
            });
        }
    </script>
</body>
</html>
