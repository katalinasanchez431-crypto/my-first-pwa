<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мій Супер PWA Клікер</title>
    <link rel="manifest" href="/my-first-pwa/manifest.json">
    <meta name="theme-color" content="#6200ee">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Забороняємо виділення тексту при кліках */
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #0f0f1a 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #a2a2d0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .counter-box {
            font-size: 64px;
            font-weight: bold;
            margin: 20px 0;
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(127, 0, 255, 0.3);
            transition: transform 0.1s ease;
        }

        /* Велика інтерактивна кнопка-куля */
        .click-sphere {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #a044ff, #6a00f4);
            margin: 30px auto;
            box-shadow: 0 10px 30px rgba(106, 0, 244, 0.5), 
                        inset -10px -10px 20px rgba(0,0,0,0.4),
                        inset 10px 10px 20px rgba(255,255,255,0.4);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .click-sphere:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(106, 0, 244, 0.7),
                        inset -5px -5px 10px rgba(0,0,0,0.4);
        }

        .status-text {
            font-size: 14px;
            color: #6c6c8c;
            margin-top: 15px;
        }

        /* Кнопка скидання */
        .reset-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #a2a2d0;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 25px;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <h1>Мій Мега Клікер</h1>
        <p style="color: #6c6c8c; font-size: 14px;">Торкніться сфери, щоб накопичувати енергію</p>
        
        <!-- Сфера для кліків -->
        <div class="click-sphere" id="clickerBtn"></div>
        
        <!-- Лічильник -->
        <div class="counter-box" id="counterDisplay">0</div>
        
        <p class="status-text" id="statusMessage">Рівень: Новачок 🌟</p>
        
        <button class="reset-btn" id="resetBtn">Скинути прогрес</button>
    </div>

    <script>
        // Логіка клікера та збереження даних в пам'ять телефону (localStorage)
        const clickerBtn = document.getElementById('clickerBtn');
        const counterDisplay = document.getElementById('counterDisplay');
        const statusMessage = document.getElementById('statusMessage');
        const resetBtn = document.getElementById('resetBtn');

        // Завантажуємо збережене значення або починаємо з 0
        let count = parseInt(localStorage.getItem('pwa_clicks')) || 0;
        counterDisplay.textContent = count;
        updateStatus(count);

        // Обробник кліку по сфері
        clickerBtn.addEventListener('click', () => {
            count++;
            counterDisplay.textContent = count;
            localStorage.setItem('pwa_clicks', count); // Зберігаємо в пам'ять смартфона
            
            // Ефект легкої пульсації цифр при кліку
            counterDisplay.style.transform = 'scale(1.1)';
            setTimeout(() => counterDisplay.style.transform = 'scale(1)', 100);
            
            updateStatus(count);
        });

        // Обробник скидання
        resetBtn.addEventListener('click', () => {
            if(confirm('Бажаєте скинути рахунок?')) {
                count = 0;
                counterDisplay.textContent = count;
                localStorage.setItem('pwa_clicks', count);
                updateStatus(count);
            }
        });

        // Функція зміни статусів залежно від набраних балів
        function updateStatus(score) {
            if (score >= 100) {
                statusMessage.textContent = "Рівень: Божественний Клікер ⚡🚀";
                statusMessage.style.color = "#ff007f";
            } else if (score >= 50) {
                statusMessage.textContent = "Рівень: Майстер Кліків 🔮";
                statusMessage.style.color = "#a044ff";
            } else if (score >= 20) {
                statusMessage.textContent = "Рівень: Досвідчений 🎯";
                statusMessage.style.color = "#00ffff";
            } else {
                statusMessage.textContent = "Рівень: Новачок 🌟";
                statusMessage.style.color = "#6c6c8c";
            }
        }

        // Реєстрація Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/my-first-pwa/sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW error', err));
            });
        }
    </script>
</body>
</html>
